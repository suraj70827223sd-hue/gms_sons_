name: Build GMS Secure APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-secure/**'
      - '.github/workflows/build-gms-secure-apk.yml'
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Recover Android source
        run: |
          mkdir -p android-native
          base64 --decode android-secure/source.b64 > /tmp/gms-android-source.zip
          unzip -q /tmp/gms-android-source.zip -d android-native
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile debug APK
        run: gradle --no-daemon --project-dir android-native assembleDebug
      - name: Verify Android APK
        run: |
          test -s android-native/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android-native/app/build/outputs/apk/debug/app-debug.apk | tail -n 2
      - uses: actions/upload-artifact@v4
        with:
          name: GMS-SONS-TRADERS-Secure-Android-APK
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
