name: Unpublish GMS Repair Hub Website
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-gms-repair-pwa.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gms-pages
  cancel-in-progress: false
jobs:
  unpublish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Attempt complete GitHub Pages removal
        id: remove
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --show-error --location --output "$RUNNER_TEMP/pages-removal-result.json" --write-out '%{http_code}' --request DELETE \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          echo "Delete GitHub Pages status: HTTP $status"
          if [[ "$status" == "204" || "$status" == "404" ]]; then
            echo "deleted=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages site was removed or is already absent."
          else
            echo "deleted=false" >> "$GITHUB_OUTPUT"
            echo "Site deletion could not be authorized; removing the public app contents instead."
          fi
      - name: Prepare unpublished placeholder
        if: steps.remove.outputs.deleted != 'true'
        run: |
          mkdir -p offline
          cat > offline/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <meta name="robots" content="noindex,nofollow,noarchive">
          <title>Website Unpublished</title>
          <style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px/1.5 system-ui,sans-serif;background:#f8fafc;color:#334155;text-align:center;padding:1rem}main{max-width:30rem}h1{font-size:1.8rem;color:#0f172a}</style>
          </head>
          <body><main><h1>Website Unpublished</h1><p>This website is currently unavailable.</p></main>
          <script>
          if("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then(regs=>Promise.all(regs.map(r=>r.unregister()))).catch(()=>{});
          if("caches" in window) caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k)))).catch(()=>{});
          </script>
          </body></html>
          EOF
          cp offline/index.html offline/404.html
          printf 'User-agent: *\nDisallow: /\n' > offline/robots.txt
          cat > offline/service-worker.js <<'EOF'
          self.addEventListener("install",()=>self.skipWaiting());
          self.addEventListener("activate", event=>event.waitUntil(self.registration.unregister()));
          EOF
      - uses: actions/configure-pages@v5
        if: steps.remove.outputs.deleted != 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.remove.outputs.deleted != 'true'
        with:
          path: offline
      - name: Remove public app from GitHub Pages
        id: deployment
        if: steps.remove.outputs.deleted != 'true'
        uses: actions/deploy-pages@v4
